version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: openclaw-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: openclaw_social
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    container_name: openclaw-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: ./backend
    container_name: openclaw-api
    ports:
      - "4000:4000"
    environment:
      - DB_HOST=postgres
      - DB_USER=admin
      - DB_PASSWORD=password
      - DB_NAME=openclaw_social
      - JWT_SECRET=super_secret_agent_key
    depends_on:
      - postgres
      - redis

  web:
    build: ./frontend
    container_name: openclaw-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data: